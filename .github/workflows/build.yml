name: Build and release

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  discover:
    name: Find current Ruby releases
    runs-on: ubuntu-24.04
    outputs:
      rubies: ${{ steps.releases.outputs.rubies }}
      latest: ${{ steps.releases.outputs.latest }}
    steps:
      - name: Find the latest two stable releases
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rubies=$(gh api repos/ruby/ruby/releases --jq \
            '[.[] | select(.draft == false and .prerelease == false) | .name | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))][0:2]')
          test "$(jq length <<<"$rubies")" -eq 2
          echo "rubies=$(jq -c . <<<"$rubies")" >> "$GITHUB_OUTPUT"
          echo "latest=$(jq -r '.[0]' <<<"$rubies")" >> "$GITHUB_OUTPUT"

  build:
    name: Ruby ${{ matrix.ruby }} (${{ matrix.tier }})
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJSON(needs.discover.outputs.rubies) }}
        tier:
          - generic
          - x86_64-v3
          - x86_64-v4

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reuse an existing package
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          RUBY_VERSION: ${{ matrix.ruby }}
          TIER: ${{ matrix.tier }}
        run: |
          archive="ruby-${RUBY_VERSION}-linux-${TIER}.tar.gz"
          mkdir -p dist
          if gh release download "$RUBY_VERSION" -R "$GITHUB_REPOSITORY" \
            --pattern "$archive" --dir dist; then
            gh release download "$RUBY_VERSION" -R "$GITHUB_REPOSITORY" \
              --pattern "$archive.sha256" --dir dist 2>/dev/null ||
              (cd dist && sha256sum "$archive" > "$archive.sha256")
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            rm -rf dist
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      # The runner image already has gcc, make, curl, xz, pkg-config, and Rust
      # (rustc is needed for YJIT). Install only what is missing.
      - name: Install build tools
        if: steps.package.outputs.build == 'true'
        run: |
          missing=()
          for tool in patchelf; do
            command -v "$tool" >/dev/null || missing+=("$tool")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install --yes --no-install-recommends "${missing[@]}"
          fi
          gcc --version | head -1
          rustc --version
          patchelf --version

      - name: Build package
        if: steps.package.outputs.build == 'true'
        run: scripts/build-portable-ruby '${{ matrix.tier }}' '${{ matrix.ruby }}'

      # archive: false uploads the file as-is instead of wrapping it in a zip.
      # It takes one file per step; the file name is the artifact name.
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/ruby-${{ matrix.ruby }}-linux-${{ matrix.tier }}.tar.gz
          archive: false
          if-no-files-found: error

      - name: Upload checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/ruby-${{ matrix.ruby }}-linux-${{ matrix.tier }}.tar.gz.sha256
          archive: false
          if-no-files-found: error

  release:
    name: Release Ruby ${{ matrix.ruby }}
    needs: [discover, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJSON(needs.discover.outputs.rubies) }}

    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ruby-${{ matrix.ruby }}-linux-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RUBY_VERSION: ${{ matrix.ruby }}
          LATEST_RUBY_VERSION: ${{ needs.discover.outputs.latest }}
        run: |
          cd dist
          ls -la
          for tier in generic x86_64-v3 x86_64-v4; do
            test -f "ruby-${RUBY_VERSION}-linux-${tier}.tar.gz"
            test -f "ruby-${RUBY_VERSION}-linux-${tier}.tar.gz.sha256"
          done
          sha256sum -c ./*.sha256
          {
            echo "Portable, relocatable Ruby ${RUBY_VERSION} for x86_64 Linux (glibc 2.39 or newer)."
            echo
            echo "| Tier | Package | SHA256 |"
            echo "|---|---|---|"
            for tier in generic x86_64-v3 x86_64-v4; do
              file="ruby-${RUBY_VERSION}-linux-${tier}.tar.gz"
              echo "| \`${tier}\` | \`${file}\` | \`$(cut -d ' ' -f 1 "${file}.sha256")\` |"
            done
            echo
            echo "See the [README](https://github.com/${GITHUB_REPOSITORY}#readme) to choose a tier and install."
            echo
            echo "Built from ${GITHUB_SHA} by run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          } > notes.md

          # Only the newest Ruby release is marked as the latest release.
          if [ "$RUBY_VERSION" = "$LATEST_RUBY_VERSION" ]; then latest_flag=--latest=true; else latest_flag=--latest=false; fi

          if gh release view "$RUBY_VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RUBY_VERSION" -R "$GITHUB_REPOSITORY" --notes-file notes.md "$latest_flag"
            gh release upload "$RUBY_VERSION" -R "$GITHUB_REPOSITORY" --clobber ./*.tar.gz ./*.sha256
          else
            gh release create "$RUBY_VERSION" -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Ruby $RUBY_VERSION" "$latest_flag" \
              --notes-file notes.md ./*.tar.gz ./*.sha256
          fi
